[project]
name = "health-analytics-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "passlib[argon2]>=1.7",
    "python-multipart>=0.0.9",
    "lxml>=5.2",
    "pandas>=2.2",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
